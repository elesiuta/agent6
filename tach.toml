# tach module map (see AGENTS.md): a red check means the map is stale,
# never that a change is forbidden.

exclude = [
  "**/.venv/**",
  "**/tests/**",
  "**/target/**",
]
source_roots = ["src"]
exact = true
forbid_circular_dependencies = true

[[modules]]
path = "agent6"
depends_on = []

[[modules]]
# Application pipelines composed over the engine, never a front-end and never
# importing agent6.ui: the run/resume lifecycle and the parallel fan-out /
# coordinator dispatch + candidate-ranking core. The front-end injects the
# presentation, process-spawn, and run-dir bridge callables it needs
# (see app/__init__.py: SessionFrontend, LaneRuntime).
path = "agent6.app"
depends_on = [
  "agent6.commit_message",
  "agent6.child_env",
  "agent6",
  "agent6.budget",
  "agent6.config",
  "agent6.config.layer",
  "agent6.directive",
  "agent6.events",
  "agent6.git_ops",
  "agent6.graph.curator",
  "agent6.graph.replay",
  "agent6.graph.storage",
  "agent6.machine",
  "agent6.memory",
  "agent6.models.cache",
  "agent6.models.pricing",
  "agent6.models.registry",
  "agent6.models.validate",
  "agent6.paths",
  "agent6.portable",
  "agent6.providers",
  "agent6.sessions.ipc",
  "agent6.sessions.id",
  "agent6.sessions.layout",
  "agent6.sessions.lock",
  "agent6.sessions.manifest",
  "agent6.sandbox",
  "agent6.sandbox.detect",
  "agent6.secrets",
  "agent6.task_text",
  "agent6.tools",
  "agent6.tools.schema",
  "agent6.types",
  "agent6.verify_infer",
  "agent6.viewmodel",
  "agent6.workflows",
]

[[modules]]
path = "agent6.ui.cli"
depends_on = [
  "agent6.commit_message",
  "agent6.ui.steer",
  "agent6.app",
  "agent6.config",
  "agent6.config.io",
  "agent6.config.layer",
  "agent6.config.write",
  "agent6.skills",
  "agent6.models.cache",
  "agent6.models.validate",
  "agent6.paths",
  "agent6.secrets",
  "agent6.sandbox.detect",
  "agent6.sandbox",
  "agent6.workflows",
  "agent6.types",
  "agent6.providers", "agent6", "agent6.tools",
  "agent6.tools.schema",
  "agent6.errors",
  "agent6.memory",
  "agent6.directive",
  "agent6.budget",
  "agent6.events",
  "agent6.git_ops",
  "agent6.init",
  "agent6.portable",
  "agent6.ui.tui",
  "agent6.ui.web",
  "agent6.ui.acp",
  "agent6.ui.spawn",
  "agent6.ui.notify",
  "agent6.viewmodel",
  "agent6.graph.storage",
  "agent6.sessions.id",
  "agent6.sessions.layout",
  "agent6.sessions.ipc",
  "agent6.sessions.manifest",
  "agent6.ui.mcp_server",
  "agent6.machine", "agent6.models.choices", "agent6.verify_infer", "agent6.ui.btw",]

[[modules]]
path = "agent6.workflows"
depends_on = [
  "agent6.commit_message",
  "agent6.paths",
  "agent6.prompts",  # pure prompt/template text the loop assembles
  # prompt show resolves the isolation a run here would get, so the preview
  # renders the same level-aware blocks the loop does
  "agent6.sandbox.detect",
  # subrun lands a finished lane's session dir in the ORIGIN state dir; the
  # bucket layout has one owner rather than a second spelling here.
  "agent6.sessions.layout",
  # the start-family emitter stamps worker.pid before the event is readable
  "agent6.sessions.ipc",
  "agent6.tools",
  "agent6.tools.schema",
  "agent6.git_ops",
  "agent6.types",
  "agent6.config",
  "agent6.directive",
  "agent6.providers",
  "agent6.budget",  # loop workflow needs BudgetExceeded
  "agent6.portable",
  "agent6.graph.curator",
  "agent6.graph.models",
  "agent6.memory",  # cross-run memories injected into the system prompt
  # the agent's own scratchpad, injected beside them
  "agent6.skills",  # operator-installed skills indexed in the system prompt
  "agent6.graph.order",  # the one walk order the frontier and list_tasks share
  "agent6.verify_infer",  # gateless runs adopt a verify mid-run (deterministic tiers)
  "agent6.task_text",  # the session.start headline is the operator's own words
]

[[modules]]
path = "agent6.providers"
depends_on = [
  "agent6",  # serverInfo.version on the claude_code MCP handshake
  "agent6.budget",
  "agent6.child_env",  # the claude_code child's curated environment
  "agent6.paths",
  "agent6.portable",
  "agent6.sandbox",  # die_with_parent ties the claude_code child to the agent
  "agent6.secrets",
]

[[modules]]
path = "agent6.events"
depends_on = ["agent6.paths"]

[[modules]]
path = "agent6.ui.tui"
# agent6.app: /undo forks in-process (app.fork), like ui.acp and ui.web.
# agent6.git_ops: one branch-tips snapshot per hub poll (the unmerged mark).
depends_on = ["agent6.app", "agent6.tools", "agent6.git_ops", "agent6.sessions.layout", "agent6.config", "agent6.config.io", "agent6.config.layer", "agent6.config.write", "agent6.directive", "agent6.errors", "agent6.ui.spawn", "agent6.ui.notify", "agent6.sessions.ipc", "agent6.sessions.manifest", "agent6.machine", "agent6.models.cache", "agent6.models.validate", "agent6.paths", "agent6.portable", "agent6.types", "agent6.viewmodel", "agent6.models.choices", "agent6.ui.btw"]

[[modules]]
# The steer seam + its file-bridge implementation, shared by the CLI's SIGINT
# machinery and terminal-less fronts (detached spawns, ACP).
path = "agent6.ui.steer"
depends_on = ["agent6.sessions.ipc"]

[[modules]]
# The /btw side ask every composer opens (CLI menu, TUI, web).
path = "agent6.ui.btw"
depends_on = ["agent6.sessions.layout", "agent6.app", "agent6.sandbox", "agent6.ui.spawn", "agent6.events"]

[[modules]]
# Find the agent6 exe and spawn it detached (new work / machines / background
# resume). Consumed by the CLI, the TUI, and the web server. Pure stdlib leaf.
path = "agent6.ui.spawn"
# The escapee sweep must not mistake a deliberately detached child (a `/btw`
# ask, a `/parallel` lane) for a jailed command's escapee and kill it.
# The one new-work spawn every hub makes: it parses the /parallel directive,
# validates its models, refuses a busy checkout, and locates the new session
# dir among the listing's.
depends_on = [
  "agent6.paths",
  "agent6.directive",
  "agent6.models.validate",
  "agent6.sandbox",
  # a detached resume resolves the session it starts and reads its worker.pid
  # (the child owns the run once that pid is its own)
  "agent6.sessions.id",
  "agent6.sessions.ipc",
  "agent6.sessions.layout",
  "agent6.sessions.lock",
  "agent6.types",
  "agent6.viewmodel",
]

[[modules]]
# Best-effort desktop notification via notify-send (fixed argv). Consumed by the
# CLI and the TUI. Pure stdlib leaf.
path = "agent6.ui.notify"
depends_on = []

[[modules]]
# The ACP front-end: JSON-RPC 2.0 over stdio, driven by an editor. Renders the
# same viewmodel folds every other surface does and drives the same app
# lifecycle, so `initialize`'s capability exchange maps onto
# FrontendCapabilities rather than needing plumbing of its own.
path = "agent6.ui.acp"
# The types SessionFrontend's own signatures name: implementing the seam means
# naming what it passes. The same set ui.cli has, minus everything that draws.
depends_on = [
  "agent6.errors",  # a fault after the journal opened is a bug unless it is an operator error
  "agent6.paths",
  "agent6.ui.steer",
  "agent6",
  "agent6.app",
  "agent6.budget",
  "agent6.config",
  "agent6.events",
  "agent6.sessions.id",
  # session/cancel drops the same stop marker the TUI and web do: a marker,
  # not a kill, so the finished step lands first.
  "agent6.sessions.ipc",
  "agent6.sessions.layout",
  # The approver and questioner the seam takes are
  # `tools.operator_prompts` protocols; building them names their values.
  "agent6.tools",
  "agent6.types",
  # The same detached-resume spawner ui.cli uses: `--detach` is a lifecycle
  # affordance, not a CLI one.
  "agent6.ui.spawn",
  # session/update is the shared transcript fold, projected. Reading the
  # journal again with ACP's own rules is how a fourth surface starts
  # disagreeing with the other three about what happened.
  "agent6.viewmodel",
  "agent6.workflows",
]

[[modules]]
# The web UI: a stdlib HTTP server + one embedded page. Renders the shared
# view-model folds (viewmodel), the effective config (config_layer), and the
# conversation (the viewmodel transcript folds), reading run/machine dirs it
# locates via the
# machine spec/journal. The write side drives the frontend bridge. No UI toolkit.
path = "agent6.ui.web"
depends_on = [
  "agent6.paths",
  # /undo forks in-process (app.fork), the same direction ui.acp already uses.
  "agent6.app",
  # One branch-tips snapshot per hub poll (the listing's unmerged mark).
  "agent6.git_ops",
  "agent6.sessions.layout",
  # run_plan reads the session's mode from its manifest before spawning.
  "agent6.sessions.manifest",
  "agent6",
  "agent6.directive",
  "agent6.viewmodel",
  "agent6.ui.spawn",
  "agent6.sessions.ipc",
  # new-work preflight: refuse a run submission while a live worker holds the
  # checkout, instead of spawning a doomed detached run
    "agent6.config",
  "agent6.config.layer",
  "agent6.config.write",
  "agent6.errors",
  "agent6.machine",
  # config-editor value suggestions: the one owner every editor and TAB
  # completion read
  "agent6.models.choices", "agent6.ui.btw",
  # the config page resolves adaptive leaves as `config show` does
]

[[modules]]
# The shared view-model: a run's logs.jsonl folded into SessionState, a machine's
# journal folded into MachineState. Consumed by the TUI, the CLI watchers, and
# (later) the web UI. The machine fold reads the journal event types + the spec,
# so it depends on those two leaf machine modules; nothing UI-toolkit-shaped.
path = "agent6.viewmodel"
depends_on = [
  "agent6.tools",
  "agent6.providers",  # a transcript is provider-wire shaped; its one content-to-text reader lives there
  "agent6.models.registry",
  "agent6.sessions.layout",
  "agent6.types",
  "agent6.config.layer",
  "agent6.machine",
  "agent6.machine.journal",
  "agent6.machine.model",
  "agent6.sessions.ipc",
  "agent6.sessions.manifest",
  "agent6.git_ops",
  "agent6.task_text",
  "agent6.budget",
]

[[modules]]
path = "agent6.init"
depends_on = ["agent6.config.layer", "agent6.config.write", "agent6.errors", "agent6.paths", "agent6.verify_infer"]

[[modules]]
path = "agent6.verify_infer"
depends_on = []


[[modules]]
path = "agent6.budget"
depends_on = ["agent6.models.pricing"]

[[modules]]
path = "agent6.models.pricing"
depends_on = ["agent6.paths"]

[[modules]]
path = "agent6.sandbox"
depends_on = [ "agent6.paths", "agent6.sandbox.landlock", "agent6.types", "agent6.child_env"]  # the provider-key names an unconfined child is stripped of

[[modules]]
# Pure-ctypes Landlock syscall wrapper: a leaf, so detection can probe the
# kernel's ABI without pulling the rest of the sandbox stack into its graph.
path = "agent6.sandbox.landlock"
depends_on = []

[[modules]]
path = "agent6.tools"
# Dispatch.py drives the in-process GraphCurator (graph.curator) using the
# graph.models intent types, for the DAG-as-tool handlers (add_task /
# update_task / set_cursor / list_tasks), and the memory store for the
# cross-run memory handlers (add_memory / invalidate_memory).
# runs.layout + runs.manifest: read_session reads this project's other sessions
# off disk, which needs the bucket layout and the typed manifest. runs.ipc: the
# effective command policy (config + the operator's session choice + away-mode)
# has one owner, and the dispatcher is where it is enforced. All leaf modules
# over the filesystem, so the dependency runs downward.
# agent6 (root): the MCP handshake sends the canonical __version__.
depends_on = ["agent6", "agent6.tools.schema", "agent6.sandbox", "agent6.types", "agent6.child_env", "agent6.config", "agent6.events", "agent6.graph.curator", "agent6.graph.models", "agent6.graph.order", "agent6.memory", "agent6.skills", "agent6.paths", "agent6.sessions.layout", "agent6.sessions.manifest", "agent6.sessions.ipc", "agent6.portable"]

[[modules]]
# graph.models: the update_task/list_tasks status pattern is derived from the
# NodeStatus Literal (one owner for the task-status vocabulary).
path = "agent6.tools.schema"
# The session-mode vocabulary: what a mode may do is read off one record
# rather than re-derived here from the bare string. notes: the scratchpad's
# size cap is the tool's own max_length, so the two cannot disagree.
depends_on = ["agent6.graph.models", "agent6.types"]

[[modules]]
# Commit message composition: pure string work, no git.
path = "agent6.commit_message"
depends_on = []

[[modules]]
path = "agent6.git_ops"
depends_on = ["agent6.commit_message", "agent6.types", "agent6.child_env"]  # the provider-key names every child is stripped of

[[modules]]
# The package __init__ re-exports the models as the public API.
path = "agent6.config"
depends_on = ["agent6.config.model", "agent6.config._providers", "agent6.config._sandbox", "agent6.config._git", "agent6.config._workflow", "agent6.config._surfaces"]

[[modules]]
# The one pydantic ConfigDict every config model shares.
path = "agent6.config._base"
depends_on = []

[[modules]]
# The [providers.*] entries, discriminated by wire format.
path = "agent6.config._providers"
depends_on = ["agent6.config._base", "agent6.config._sandbox"]

[[modules]]
# The [sandbox] and [mcp] models; paths for the private-dir grant refusals.
path = "agent6.config._sandbox"
# _surfaces: is_loopback_host, shared with the web bind gate.
depends_on = ["agent6.config._base", "agent6.config._surfaces", "agent6.paths"]

[[modules]]
# The [git] model: worktree policy, chain commits, merge and message styles.
path = "agent6.config._git"
depends_on = ["agent6.config._base"]

[[modules]]
# The loop-behaviour models: workflow, review, context, prompt, budget.
path = "agent6.config._workflow"
depends_on = ["agent6.config._base"]

[[modules]]
# The surface models: skills, machine, web, notify, parallel.
path = "agent6.config._surfaces"
depends_on = ["agent6.config._base"]

[[modules]]
path = "agent6.config.model"
# RoleName and the session-mode vocabulary: shared value types, so they live
# at the leaf rather than in whichever model declared one first.
# agent6.errors: ConfigError subclasses OperatorError, so a bad config presents
# as the operator's mistake at the CLI boundary.
depends_on = [
  "agent6.config._base",
  "agent6.config._providers",
  "agent6.config._sandbox",
  "agent6.config._git",
  "agent6.config._workflow",
  "agent6.config._surfaces",
  "agent6.types",
  "agent6.errors",
]

[[modules]]
# The environment a process spawned OUTSIDE the jail inherits. A leaf because
# its two callers sit on opposite sides of the layering: the operator's notify
# hooks (app) and the MCP servers (tools). Pure stdlib.
path = "agent6.child_env"
depends_on = []

[[modules]]
path = "agent6.paths"
depends_on = []

[[modules]]
path = "agent6.secrets"
depends_on = ["agent6.paths", "agent6.portable"]

[[modules]]
path = "agent6.config.io"
depends_on = ["agent6.config.model", "agent6.errors", "agent6.portable"]

[[modules]]
path = "agent6.config.layer"
depends_on = ["agent6.config.model", "agent6.config.io", "agent6.paths"]

[[modules]]
path = "agent6.config.write"
depends_on = ["agent6.config.model", "agent6.config._providers", "agent6.config.io", "agent6.config.layer", "agent6.errors", "agent6.paths", "agent6.portable"]

[[modules]]
path = "agent6.models.cache"
depends_on = ["agent6.config", "agent6.models.pricing", "agent6.paths", "agent6.providers", "agent6.secrets"]

[[modules]]
# Curated model capabilities (context windows, compaction sizing, per-model
# prompting defaults); composes the live listing cache for windows the
# bundled table omits.
path = "agent6.models.registry"
# agent6.providers: the openai wire owns what an unset effort resolves to, so
# `config show` reads the rule rather than restating it.
depends_on = ["agent6.config", "agent6.models.cache", "agent6.providers", "agent6.types"]

[[modules]]
# Pre-spawn model validation + did-you-mean (configured roles + `/parallel`
# specs), shared by the three front-ends and the coordinator's group
# dispatcher. Cache-first matching via the registry's normalization; a miss
# re-fetches the live listing (secrets: the key for the authed fetch) so a
# refusal never rests on a stale snapshot.
path = "agent6.models.validate"
depends_on = ["agent6.config", "agent6.models.cache", "agent6.models.registry", "agent6.secrets", "agent6.config.layer", "agent6.directive"]

[[modules]]
# The values an open-text config leaf can take (a provider's model ids, the
# /parallel lane ids): one owner behind every editor's picker, the web suggest
# route, and TAB completion.
path = "agent6.models.choices"
depends_on = ["agent6.config", "agent6.config.layer", "agent6.models.cache", "agent6.models.validate", "agent6.secrets", "agent6.types"]

[[modules]]
path = "agent6.sandbox.detect"
depends_on = ["agent6.sandbox.landlock", "agent6.types"]

[[modules]]
path = "agent6.types"
depends_on = []

[[modules]]
path = "agent6.task_text"
depends_on = []

[[modules]]
# The operator-error boundary: OperatorError + the operator-file reader.
# A leaf so both the trust-boundary models (config) and the front-ends can
# raise/catch the one type.
path = "agent6.errors"
depends_on = []

[[modules]]
path = "agent6.portable"
depends_on = []

[[modules]]
# The shared `/parallel` grammar (parse + spec), imported by the coordinator
# (workflows) and the composers/CLI (ui). A pure-stdlib leaf both layers sit
# above, so neither side re-implements the syntax and the CLI --parallel value
# grammar stays identical to the directive spec.
path = "agent6.directive"
depends_on = []

[[modules]]
# MemoryStoreError subclasses OperatorError, so a store refusal presents as the
# operator's at the CLI boundary while the run loop keeps its degrade catches.
path = "agent6.memory"
depends_on = ["agent6.errors", "agent6.paths", "agent6.portable"]

[[modules]]
path = "agent6.skills"
depends_on = []

[[modules]]
# Pure prompt + template text (the strings agent6 sends to models). A leaf: it
# imports nothing from agent6, so the typed assembly that fills these templates
# lives one layer up (workflows/_prompt_blocks, machine/authoring).
path = "agent6.prompts"
depends_on = []

[[modules]]
path = "agent6.graph"
depends_on = []

[[modules]]
# The one walk order every surface reads a task graph in: the frontier
# (workflows), the model's own list_tasks (tools) and the renderers. A leaf
# over the node types, so sharing it pulls in nothing else.
path = "agent6.graph.order"
depends_on = ["agent6.graph.models"]

[[modules]]
path = "agent6.graph.replay"
# Pure: the current nodes plus the journal in, the graph at an older
# graph_version out. No storage, so `fork` owns the read and the write.
depends_on = ["agent6.graph.models"]

[[modules]]
path = "agent6.graph.models"
# graph.ulid: the id validator enforces the ULID alphabet at the reload trust
# boundary (an id becomes a filesystem path component).
depends_on = ["agent6.graph.ulid"]

[[modules]]
path = "agent6.graph.ulid"
depends_on = []

[[modules]]
path = "agent6.sessions.id"
# The bucket layout: minting an id means checking the directory it would name,
# so the generator and the guard sit together rather than each caller spelling
# the path out. git_ops: an explicit --session-id must be a valid git branch
# name (it becomes agent6/<id> and refs/agent6/<id>/head) before state creation.
depends_on = ["agent6._data", "agent6.git_ops", "agent6.graph.ulid", "agent6.sessions.layout"]

[[modules]]
path = "agent6._data"
depends_on = []

[[modules]]
path = "agent6.ui.mcp_server"
depends_on = [
  "agent6.paths",
  "agent6",
  "agent6.config",
  "agent6.config.layer",
  "agent6.tools",
  "agent6.graph.storage",
  "agent6.sessions.id",
  "agent6.sessions.layout",
  "agent6.sessions.manifest",
  "agent6.viewmodel",
]

[[modules]]
path = "agent6.sessions.layout"
depends_on = ["agent6.paths", "agent6.portable", "agent6.sessions.manifest"]

[[modules]]
# The single manifest.json reader (the writer is app.manifest). A pure leaf:
# app, the viewmodel, and the CLI parse a run's manifest through this one owner.
path = "agent6.sessions.manifest"
# The session-mode vocabulary. Keeping a second list here let the two
# disagree: this module refused a mode the tool surface happily built.
depends_on = ["agent6.types"]

[[modules]]
# One authoritative writer per run dir: the worker.lock flock run/resume/fork
# take before touching a run's shared state.
path = "agent6.sessions.lock"
depends_on = ["agent6.portable", "agent6.paths"]

[[modules]]
# The run-dir answer-file contract the workflow process polls and every
# front-end writes (approve / ask_user / steer / stop / compact markers, worker
# pid liveness, detach away-mode). Pure stdlib filesystem primitives; a leaf so
# app, the viewmodel, and the three front-ends all read/write run state without
# a ui edge.
path = "agent6.sessions.ipc"
# atomic_write: the answer files need a unique-temp durable write (two live
# front-ends answering one prompt raced on a shared .tmp).
# events: the start-family emitter owns the worker-pid-before-start order.
depends_on = ["agent6.events", "agent6.paths", "agent6.portable"]

[[modules]]
path = "agent6.graph.storage"
depends_on = ["agent6.graph.models", "agent6.paths", "agent6.portable", "agent6.sessions.layout"]

[[modules]]
path = "agent6.graph.curator"
depends_on = ["agent6.graph.models", "agent6.graph.order", "agent6.graph.storage", "agent6.graph.ulid"]

[[modules]]
path = "agent6.machine"
depends_on = ["agent6.machine.authoring", "agent6.machine.model", "agent6.machine._semantics", "agent6.machine.graph", "agent6.machine.engine", "agent6.machine.journal", "agent6.machine.dryrun"]

[[modules]]
path = "agent6.machine.authoring"
depends_on = ["agent6.prompts"]

[[modules]]
path = "agent6.machine.predicate"
depends_on = []

[[modules]]
path = "agent6.machine.template"
depends_on = ["agent6.machine.predicate"]

[[modules]]
path = "agent6.machine.model"
depends_on = []

[[modules]]
# Load + semantic validation; the cross-cutting rules over the model shapes.
path = "agent6.machine._semantics"
depends_on = ["agent6.machine.model", "agent6.machine.predicate", "agent6.machine.template"]

[[modules]]
path = "agent6.machine.graph"
depends_on = ["agent6.machine.model"]

[[modules]]
# JournalError subclasses MachineError (machine.model), so a broken journal and
# a broken machine file degrade through the same catch sites.
path = "agent6.machine.journal"
depends_on = ["agent6.machine.model", "agent6.paths", "agent6.portable"]

[[modules]]
path = "agent6.machine.engine"
depends_on = ["agent6.sessions.layout", "agent6.machine.model", "agent6.machine._semantics", "agent6.machine.template", "agent6.machine.predicate", "agent6.machine.journal", "agent6.sandbox", "agent6.types", "agent6.paths", "agent6.portable"]

[[modules]]
path = "agent6.machine.dryrun"
depends_on = ["agent6.machine.model", "agent6.machine._semantics", "agent6.machine.template", "agent6.machine.predicate", "agent6.machine.journal", "agent6.machine.engine"]
